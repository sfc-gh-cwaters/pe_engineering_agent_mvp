    join_type: inner
    relationship_type: many_to_one
    relationship_columns:
      - left_column: WELLBORE_NAME
        right_column: WELLBORE_NAME
verified_queries:
  - name: 0;1
    question: What is the daily oil, gas, and water production by well over time for
      wells that are producing oil?
    sql: SELECT WELLBORE_NAME, PRODUCTION_DATE, OIL_VOL_SM3, GAS_VOL_SM3, WATER_VOL_SM3,
      WATER_CUT, GOR_SM3_SM3 FROM production_daily WHERE OIL_VOL_SM3 > 0 ORDER BY
      PRODUCTION_DATE
    verified_at: 1783145057
    verified_by: Semantic Model Generator
  - name: 1;1
    question: How does cumulative production correlate with reservoir properties like
      porosity and permeability?
    sql: SELECT p.WELLBORE_NAME, SUM(p.OIL_VOL_SM3) AS TOTAL_OIL, SUM(p.WATER_VOL_SM3)
      AS TOTAL_WATER, AVG(p.WATER_CUT) AS AVG_WATER_CUT, s.AVG_POROSITY_NET, s.AVG_PERM_NET_MD,
      s.NET_TO_GROSS FROM production_daily AS p JOIN petrophysics_well_summary_table
      AS s ON p.WELLBORE_NAME = s.WELLBORE_NAME GROUP BY p.WELLBORE_NAME, s.AVG_POROSITY_NET,
      s.AVG_PERM_NET_MD, s.NET_TO_GROSS
    verified_at: 1783145057
    verified_by: Semantic Model Generator
  - name: 2;1
    question: What is the pressure drawdown trend and its relationship to oil production
      rate across all wells over time?
    sql: SELECT WELLBORE_NAME, PRODUCTION_DATE, AVG_DHP_BARA, AVG_WHP_BARA, DRAWDOWN_BARA,
      OIL_VOL_SM3 FROM production_daily WHERE NOT AVG_DHP_BARA IS NULL ORDER BY WELLBORE_NAME,
      PRODUCTION_DATE
    verified_at: 1783145057
    verified_by: Semantic Model Generator
  - name: 3;1
    question: What is the average production performance for each producing well?
    sql: SELECT WELLBORE_NAME, AVG(OIL_VOL_SM3) AS AVG_DAILY_OIL, AVG(WATER_CUT) AS
      AVG_WATER_CUT, AVG(GOR_SM3_SM3) AS AVG_GOR, COUNT(*) AS PRODUCING_DAYS FROM
      production_daily WHERE WELL_STATUS = 'PRODUCING' GROUP BY WELLBORE_NAME
    verified_at: 1783145057
    verified_by: Semantic Model Generator
